<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. ตั้งชื่อ Title เว็บตรงนี้ -->
    <title>D&D Companion</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="D&D Companion - ผู้ช่วยส่วนตัวสำหรับการเล่น Dungeons & Dragons ของคุณ จัดการตัวละคร ทอยเต๋า 3D และข้อมูล D&D แบบครบวงจร" />
    <meta name="keywords" content="D&D, Dungeons & Dragons, Companion, Dice Roller, Character Sheet" />
    <meta name="author" content="Exises (Phitchayut)" />

    <!-- Open Graph (สำหรับแชร์ลง Social Media แล้วมีรูป/ข้อความขึ้น) -->
    <meta property="og:title" content="D&D Companion" />
    <meta property="og:description" content="ผู้ช่วยส่วนตัวสำหรับการเล่น Dungeons & Dragons จัดการตัวละครและทอยเต๋า 3D" />
    <meta property="og:type" content="website" />

    <!-- 2. เอา Link Fonts จากไฟล์เดิมมาใส่ -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Anuphan:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <!-- 3. เอา Link Icons (FontAwesome) จากไฟล์เดิมมาใส่ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  </head>
  <body>
    <!-- นี่คือ "กรอบรูป" ที่ React จะเอาเนื้อหามาแปะ (ห้ามลบ id="root") -->
    <div id="root"></div>
    
    <!-- บรรทัดนี้สำคัญมาก! มันคือตัวเรียก React ให้ทำงาน -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
